name: "You Up? Heartbeat"
description: "Send a Heartbeat signal to You Up? when a scheduled workflow or deployment job succeeds."
author: "You Up?"

branding:
  icon: "activity"
  color: "green"

inputs:
  url:
    description: "Heartbeat URL from You Up? (for example, from secrets.UUP_HEARTBEAT_URL). Falls back to UUP_HEARTBEAT_URL."
    required: false
    default: ""
  timeout:
    description: "Maximum time in seconds for the HTTP request."
    required: false
    default: "10"
  retries:
    description: "Number of retries on transient network or 5xx errors."
    required: false
    default: "3"
  fail-on-error:
    description: "Set to true to fail the step when the Heartbeat request does not return 2xx."
    required: false
    default: "false"

outputs:
  status:
    description: "Result of the step: sent, skipped, or failed."
    value: ${{ steps.send.outputs.status }}

runs:
  using: "composite"
  steps:
    - id: send
      name: Send Heartbeat signal
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        FALLBACK_URL: ${{ env.UUP_HEARTBEAT_URL }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail

        target_url="${INPUT_URL:-${FALLBACK_URL:-}}"
        target_url="${target_url#"${target_url%%[![:space:]]*}"}"
        target_url="${target_url%"${target_url##*[![:space:]]}"}"

        if [ -z "$target_url" ]; then
          echo "Heartbeat URL is not set. Skipping signal."
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "::add-mask::${target_url}"

        if [[ ! "$target_url" =~ ^https?:// ]]; then
          echo "status=failed" >> "$GITHUB_OUTPUT"
          msg="Heartbeat URL must start with https:// (or http:// for local tests)."
          if [ "$INPUT_FAIL_ON_ERROR" = "true" ]; then
            echo "::error::${msg}"
            exit 1
          fi
          echo "::warning::${msg}"
          exit 0
        fi

        timeout_sec="${INPUT_TIMEOUT:-10}"
        if [[ ! "$timeout_sec" =~ ^[0-9]+$ ]] || [ "$timeout_sec" -lt 1 ]; then
          timeout_sec=10
        fi

        retries="${INPUT_RETRIES:-3}"
        if [[ ! "$retries" =~ ^[0-9]+$ ]]; then
          retries=3
        fi

        http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time "$timeout_sec" --retry "$retries" --user-agent "uupdev-heartbeat-github-action/1" -- "$target_url" || true)"

        if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
          echo "Heartbeat signal sent (HTTP ${http_code})."
          echo "status=sent" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "status=failed" >> "$GITHUB_OUTPUT"
        msg="Heartbeat signal did not succeed (HTTP ${http_code})."
        if [ "$INPUT_FAIL_ON_ERROR" = "true" ]; then
          echo "::error::${msg}"
          exit 1
        fi
        echo "::warning::${msg}"
        exit 0
